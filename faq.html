    <script>
      /* Hide the page for an instant when it will be shown in French, so the English text never flashes. */
      try {
        var l = new URLSearchParams(location.search).get('lang') || localStorage.getItem('holydjo-lang') || navigator.language;
        if (/^fr/i.test(l)) {
          document.documentElement.lang = 'fr-CA';
          document.documentElement.classList.add('i18n-pending');
          setTimeout(function () {
            document.documentElement.classList.remove('i18n-pending');
          }, 3000);
        }
      } catch (e) {}
    </script>
    <style>
      html.i18n-pending body {
        visibility: hidden;
      }
